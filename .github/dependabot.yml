version: 2

updates:
  # ci.yml and release.yml pin actions by immutable commit SHA. Dependabot
  # opens reviewed SHA bumps without restoring mutable major tags.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions-maintenance:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: ci

  # Package.swift / Package.resolved.  Sparkle is deliberately pinned to an
  # exact version in project.yml as well, so a bump here needs that file
  # changed in the same PR — Scripts/sync-versions.sh does not check it.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
