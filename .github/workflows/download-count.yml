name: Refresh download counter

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: download-counter
  cancel-in-progress: true

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Calculate the cumulative total download count
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/download-counter"
          Scripts/report-download-counts.sh --all --json > "$RUNNER_TEMP/download-counter/report.json"
          TOTAL="$(jq -er '.downloads.acquisition_dmgs' "$RUNNER_TEMP/download-counter/report.json")"
          jq -n --arg total "$TOTAL" \
            '{schemaVersion: 1, label: "total downloads", message: $total, color: "307afe"}' \
            > "$RUNNER_TEMP/download-counter/downloads.json"
          bash Scripts/download-count-badge.sh "$TOTAL" > "$RUNNER_TEMP/download-counter/downloads.svg"

      - name: Publish the download counter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Before the first release there is nothing to attach the badge to,
          # and that is a no-op rather than a failed workflow. Distinguish it
          # from a real API failure: `gh release list` exits 0 with no output
          # when a repository simply has no releases, and non-zero on an
          # expired token, rate limit, or transient error — which must surface
          # rather than let the badge silently go stale behind a green run.
          # Assign first: inside `[ -z "$(...)" ]` the command's failure
          # status is discarded and `set -e` never sees it.
          LATEST="$(gh release list --limit 1)"
          if [ -z "$LATEST" ]; then
            echo "no published release yet; nothing to attach the counter to"
            exit 0
          fi
          TAG="$(gh release view --json tagName --jq .tagName)"
          # Metrics are mutable; signed application archives and feeds are not.
          gh release upload "$TAG" \
            "$RUNNER_TEMP/download-counter/downloads.json" \
            "$RUNNER_TEMP/download-counter/downloads.svg" --clobber

      - name: Publish the README badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST="$(gh release list --limit 1)"
          if [ -z "$LATEST" ]; then
            echo "no published release yet; no badges to publish"
            exit 0
          fi
          # Release assets download as application/octet-stream, which
          # GitHub's README image proxy refuses, and Shields blocks github.com
          # endpoints. raw.githubusercontent.com serves SVG as an image and is
          # an allowed Shields endpoint host, so the badges live on a
          # one-commit orphan branch that is replaced on every refresh.
          NAME="$(gh release view --json name --jq .name)"
          VERSION="$(sed -nE 's/^Downright ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' <<<"$NAME")"
          if [ -z "$VERSION" ]; then
            echo "cannot read a version from the latest release name: $NAME" >&2
            exit 1
          fi
          BADGES="$RUNNER_TEMP/badges"
          mkdir -p "$BADGES"
          cp "$RUNNER_TEMP/download-counter/downloads.json" \
            "$RUNNER_TEMP/download-counter/downloads.svg" "$BADGES/"
          jq -n --arg version "v$VERSION" \
            '{schemaVersion: 1, label: "release", message: $version, color: "307afe"}' \
            > "$BADGES/release.json"
          gh auth setup-git
          git -C "$BADGES" init -q -b metrics
          git -C "$BADGES" add downloads.json downloads.svg release.json
          git -C "$BADGES" -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Refresh README badges"
          git -C "$BADGES" push --force "https://github.com/${GITHUB_REPOSITORY}.git" metrics
