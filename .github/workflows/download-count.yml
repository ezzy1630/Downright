name: Refresh download counter

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: download-counter
  cancel-in-progress: true

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Calculate the cumulative total download count
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/download-counter"
          Scripts/report-download-counts.sh --all --json > "$RUNNER_TEMP/download-counter/report.json"
          TOTAL="$(jq -er '.downloads.acquisition_dmgs' "$RUNNER_TEMP/download-counter/report.json")"
          jq -n --arg total "$TOTAL" \
            '{schemaVersion: 1, label: "total downloads", message: $total, color: "307afe"}' \
            > "$RUNNER_TEMP/download-counter/downloads.json"

      - name: Publish the Shields endpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Before the first release there is nothing to attach the badge to,
          # and `gh release view` exits non-zero. A metrics refresh with no
          # destination is a no-op, not a failed workflow.
          TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$TAG" ]; then
            echo "no published release yet; nothing to attach the counter to"
            exit 0
          fi
          # Metrics are mutable; signed application archives and feeds are not.
          gh release upload "$TAG" "$RUNNER_TEMP/download-counter/downloads.json" --clobber
