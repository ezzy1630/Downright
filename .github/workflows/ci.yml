name: CI

on:
  workflow_call:
    inputs:
      production:
        description: Require production updater acceptance before release
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

# Manual branch runs cancel older manual runs. Main release calls never
# cancel an in-flight release or its validation.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  source-check:
    # AppKit Liquid Glass requires the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: source
            mode: --source-only
            scratch: .build-ci-main
            coverage: --require-tests
          - name: performance
            mode: --bench-only
            scratch: .build-ci-main-bench
            coverage: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fast repository checks
        if: matrix.name == 'source'
        run: Scripts/check-fast.sh
      - name: Select and verify the Swift toolchain
        run: ./Scripts/select-toolchain.sh
      - name: Identify compiler and SDK for the build cache
        id: cache-toolchain
        run: |
          ID=$( { xcodebuild -version; swift --version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - name: Restore Swift build graph
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ matrix.scratch }}
            !${{ matrix.scratch }}/**/index
          key: swift-v2-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Vendor/**', 'Scripts/check.sh', 'Scripts/test.sh') }}-${{ github.sha }}
          restore-keys: |
            swift-v2-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Vendor/**', 'Scripts/check.sh', 'Scripts/test.sh') }}-
      - name: Run ${{ matrix.name }} gate
        env:
          CHECK_NAME: ${{ matrix.name }}
          CHECK_MODE: ${{ matrix.mode }}
          CHECK_COVERAGE: ${{ matrix.coverage }}
          SCRATCH: ${{ matrix.scratch }}
          BENCH_SCRATCH: ${{ matrix.scratch }}
          CHECK_VERBOSE_BUILD: "1"
          CI_CACHE_REQUESTED_KEY: ${{ steps.cache.outputs.cache-primary-key }}
          CI_CACHE_MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          CI_CACHE_EXACT_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          python3 Scripts/ci-report.py --name "$CHECK_NAME" --output ".build-ci-evidence/$CHECK_NAME" \
            ${CHECK_COVERAGE:+"$CHECK_COVERAGE"} -- Scripts/check.sh "$CHECK_MODE"
      - name: Save validated Swift build graph
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.cache.outputs.cache-primary-key }}
          path: |
            ${{ matrix.scratch }}
            !${{ matrix.scratch }}/**/index
      - name: Retain diagnostics and timing report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build-ci-evidence/${{ matrix.name }}
          retention-days: 7
          if-no-files-found: warn

  # Keep the existing PR readback contract. The matrix reports success only
  # when both source tests and the release performance budgets have passed.
  swift:
    if: always()
    needs: source-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both source and performance gates
        env:
          RESULT: ${{ needs.source-check.result }}
        run: test "$RESULT" = success

  app-acceptance:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/native-check
        with:
          name: native-acceptance

  production-updater:
    if: inputs.production
    runs-on: macos-26
    environment: release
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/native-check
        with:
          name: production-updater
          configuration: Release
          production: '1'
          sparkle-public-key: ${{ secrets.SPARKLE_ED25519_PUBLIC_KEY }}
