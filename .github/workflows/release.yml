name: Release

# Every push to `main` triggers the rolling production pipeline: gates → tests →
# signed, notarized, stapled universal build → Sparkle-signed appcast → GitHub
# Release → GitHub Pages deployment. Feature-branch pushes are covered by CI;
# a merge or push to `main` is the release event. All secrets live in the
# `release` environment, and the newest verified build becomes the download
# and updater channel.

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # The app directly references macOS 26 AppKit Liquid Glass APIs, so both
    # CI and the shipping archive must compile against the macOS 26 SDK.
    runs-on: macos-26
    environment: release
    outputs:
      marketing_version: ${{ steps.release_identity.outputs.marketing_version }}
      build: ${{ steps.release_identity.outputs.build }}
      tag: ${{ steps.release_identity.outputs.tag }}
      release_tag: ${{ steps.release_identity.outputs.release_tag }}
    timeout-minutes: 90
    permissions:
      contents: write        # publish the GitHub Release + assets
      id-token: write        # GitHub Pages deployment
      pages: write

    env:
      MARKETING_VERSION_FILE: Config/version.env
      SCRATCH: .build-ci-main
      TEST_SCRATCH: .build-ci-test

    steps:
      # ---------------------------------------------------------------- gates
      - name: Checkout full history
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Derive release identity and validate main
        id: release_identity
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "main" ] || {
            echo "::error::release workflow only accepts pushes to main (got $GITHUB_REF_NAME)"
            exit 1
          }
          # shellcheck disable=SC1091
          source Config/version.env
          if ! echo "$MARKETING_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::MARKETING_VERSION '$MARKETING_VERSION' is not SemVer X.Y.Z"
            exit 1
          fi
          # build-number.sh is deterministic on this clean full checkout. The
          # commit count is the numeric CFBundleVersion Sparkle compares.
          BUILD="$(Scripts/build-number.sh)"
          if ! echo "$BUILD" | grep -Eq '^[0-9]+$'; then
            echo "::error::release build number '$BUILD' is not numeric"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA:0:12}"
          # TAG is used in immutable asset filenames. RELEASE_TAG identifies
          # this rolling main-channel build without moving an existing tag.
          TAG="${MARKETING_VERSION}-${BUILD}-${SHORT_SHA}"
          RELEASE_TAG="auto-${GITHUB_SHA}"
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG"
          echo "RELEASE_TAG=$RELEASE_TAG"
          # The pushed commit must still be reachable from protected main.
          # Keep the full checkout history intact: build-number.sh derives
          # CURRENT_PROJECT_VERSION from the reachable commit count.
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::pushed commit is not reachable from origin/main"; exit 1
          fi
          # Working tree must be clean (no generated-file drift).
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::dirty working tree:"; git status --porcelain; exit 1
          fi
          Scripts/sync-versions.sh

      # Same reason as CI: pick a toolchain that satisfies the manifest and
      # fail loudly here if the image no longer ships one.  Every later step
      # (swift, xcodebuild, xcrun) inherits the exported DEVELOPER_DIR.
      - name: Select and verify the Swift toolchain
        run: ./Scripts/select-toolchain.sh

      # xcodegen generates the Xcode project that becomes the signed,
      # notarized archive, so it is pinned like every other release input:
      # a checksummed upstream binary instead of a floating Homebrew head.
      - name: Install pinned xcodegen
        run: |
          set -euo pipefail
          XCODEGEN_VERSION=2.46.0
          XCODEGEN_SHA256=4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          sudo mkdir -p /usr/local/bin /usr/local/share
          sudo cp "$RUNNER_TEMP/xcodegen/bin/xcodegen" /usr/local/bin/xcodegen
          sudo chmod +x /usr/local/bin/xcodegen
          # The SettingPresets (ONLY_ACTIVE_ARCH=YES for Debug, plus the other
          # default settings) ship in the zip's share/ tree, which xcodegen
          # resolves relative to the binary. A binary-only install silently
          # drops them, and the generated project then builds app-extension
          # targets for every standard architecture, mismatching the arm64-only
          # package modules. Copy the tree, not just the binary.
          sudo cp -R "$RUNNER_TEMP/xcodegen/share/xcodegen" /usr/local/share/xcodegen
          xcodegen --version

      - name: Resolve pinned dependencies
        run: swift package resolve

      - name: Run full check suite (all unit/UI suites + version gates)
        env:
          RUN_DRBENCH: "1"  # release performance budgets enforced
        run: ./Scripts/check.sh

      # ----------------------------------------------------------- build (Xcode)
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Prepare production Info.plist (inject public key from secret)
        run: Scripts/prepare-release-info-plist.sh
        env:
          SPARKLE_ED25519_PUBLIC_KEY: ${{ secrets.SPARKLE_ED25519_PUBLIC_KEY }}

      - name: Exercise production updater from a lower version
        # This is intentionally before the archive is created. A future UI
        # transition regression must stop the release while the public channel
        # still points at the last known-good build.
        env:
          APP_ACCEPTANCE_PRODUCTION: "1"
          APP_ACCEPTANCE_CONFIGURATION: Release
          APP_ACCEPTANCE_MARKETING_VERSION: "1.0.15"
          APP_ACCEPTANCE_BUILD_NUMBER: "1"
          DOWNRIGHT_UPDATER_SMOKE: "1"
          APP_ACCEPTANCE_SCRATCH: .build-production-updater-smoke
          SPOTLIGHT_SCRATCH: .build-production-updater-smoke-spm
          SPARKLE_ED25519_PUBLIC_KEY: ${{ secrets.SPARKLE_ED25519_PUBLIC_KEY }}
        run: Scripts/check-app.sh

      - name: Build Release archive (universal)
        run: |
          set -euo pipefail
          BUILD="${BUILD:?release build number was not derived in the validation step}"
          xcodebuild \
            -project Downright.xcodeproj \
            -scheme Downright \
            -configuration Release \
            -derivedDataPath .build-release \
            -archivePath .build-release/Downright.xcarchive \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Embed CLI, Sparkle, extensions, and verify layout
        run: |
          set -euo pipefail
          APP=".build-release/Downright.xcarchive/Products/Applications/Downright.app"
          echo "APP=$APP" >> "$GITHUB_ENV"
          swift build -c release --scratch-path .build-release-spm --product down
          # SwiftPM puts products directly under the scratch directory on
          # older toolchains, but adds the target triple on newer ones. Ask
          # SwiftPM for the active binary directory instead of assuming one
          # of those layouts.
          CLI_BIN="$(swift build -c release --scratch-path .build-release-spm --product down --show-bin-path)/down"
          test -x "$CLI_BIN"
          cp "$CLI_BIN" "$APP/Contents/MacOS/down"
          # XcodeGen's `embed: true` for an SPM framework has produced both a
          # direct product and an archive-only BuildProductsPath across Xcode
          # releases. Prefer the already-embedded archive product, then the
          # known derived-data locations, rather than assuming one layout.
          FW=""
          for candidate in \
              "$APP/Contents/Frameworks/Sparkle.framework" \
              ".build-release/Build/Products/Release/Sparkle.framework" \
              ".build-release/Build/Products/Release/PackageFrameworks/Sparkle.framework" \
              ".build-release/Build/Intermediates.noindex/ArchiveIntermediates/Downright/BuildProductsPath/Release/Sparkle.framework"; do
            if [ -d "$candidate" ]; then
              FW="$candidate"
              break
            fi
          done
          test -n "$FW"
          echo "Sparkle source: $FW"
          test -d "$FW"
          if [ "$FW" != "$APP/Contents/Frameworks/Sparkle.framework" ]; then
            rm -rf "$APP/Contents/Frameworks/Sparkle.framework"
            cp -R "$FW" "$APP/Contents/Frameworks/"
          fi
          # Xcode emits SwiftPM resource bundles as deep bundles
          # (Contents/Resources/…), while the runtime resource resolvers and
          # the bundle contract use the flat layout. Flatten every bundle,
          # including the nested SwiftMath font bundle, before anything is
          # signed. The final verify-bundle call runs after signing because it
          # also checks the Quick Look sandbox entitlements.
          while IFS= read -r bundle; do
            deep="$bundle/Contents/Resources"
            [ -d "$deep" ] || continue
            ditto "$deep" "$bundle"
            rm -rf "$bundle/Contents"
          done < <(find "$APP" -type d -name "*.bundle")
          # The manual embed above put Sparkle in place; prove it.
          test -d "$APP/Contents/Frameworks/Sparkle.framework"
          # A classic MDImporter is nested code too. Build it from the same
          # source as local bundles before the signing step seals the archive.
          APP="$APP" SPOTLIGHT_SCRATCH=.build-release-spm \
            SPOTLIGHT_CONFIGURATION=release \
            Scripts/bundle-spotlight.sh

      # ---------------------------------------------------------------- signing
      - name: Import Developer ID into ephemeral keychain
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          # Publish the cleanup target before any setup command can fail. The
          # always-run cleanup step needs this even when import or discovery
          # aborts before the identity is available.
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          PASSWORD="$(openssl rand -hex 24)"
          # Secrets land under the runner's private temp dir, never the shared
          # /tmp. The generated keychain password is not exported: it is not a
          # registered GitHub secret (so it would not be masked in logs), and
          # the signing step below never needs it — the keychain stays
          # unlocked for this job once created.
          CERT_P12="$RUNNER_TEMP/downright-cert.p12"
          echo "$DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 --decode > "$CERT_P12"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$CERT_P12" -k "$KEYCHAIN" \
            -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' \
            | head -n 1)"
          test -n "$IDENTITY"
          echo "Imported signing identity: $IDENTITY"
          rm -f "$CERT_P12"
          echo "DEVELOPER_ID_APPLICATION_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}

      - name: Sign every nested executable (no --deep)
        run: |
          set -euo pipefail
          APP="${{ env.APP }}"
          IDENTITY="${DEVELOPER_ID_APPLICATION_IDENTITY:?missing imported Developer ID identity}"
          KEYCHAIN="${KEYCHAIN:?missing ephemeral signing keychain}"
          sign() { codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$1"; }
          sign_preserving_entitlements() {
            codesign --force --options runtime --timestamp \
              --keychain "$KEYCHAIN" --preserve-metadata=entitlements --sign "$IDENTITY" "$1"
          }
          sign_quicklook() {
            codesign --force --options runtime --timestamp \
              --keychain "$KEYCHAIN" --entitlements Config/QuickLook.entitlements --sign "$IDENTITY" "$1"
          }
          # Sparkle's documented manual distribution order is inside-out.
          # Downloader carries a required entitlement that re-signing must
          # preserve; the other helpers still need our hardened-runtime seal.
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          SPARKLE_VERSION="$SPARKLE/Versions/B"
          sign "$SPARKLE_VERSION/XPCServices/Installer.xpc"
          sign_preserving_entitlements "$SPARKLE_VERSION/XPCServices/Downloader.xpc"
          sign "$SPARKLE_VERSION/Autoupdate"
          sign "$SPARKLE_VERSION/Updater.app"
          sign "$SPARKLE"
          # Spotlight importer: sign the Mach-O bundle first, then its
          # containing .mdimporter bundle, before the host resource envelope.
          SPOTLIGHT="$APP/Contents/Library/Spotlight/DownrightSpotlight.mdimporter"
          sign "$SPOTLIGHT/Contents/MacOS/DownrightSpotlight"
          sign "$SPOTLIGHT"
          # Quick Look extensions.
          for appex in "$APP"/Contents/PlugIns/*.appex; do
            sign_quicklook "$appex"
          done
          # The CLI lives in MacOS/ and is signed as part of the app bundle.
          sign "$APP/Contents/MacOS/down"
          # The host last.
          sign "$APP"
          # Verify each individually.
          for item in "$APP" "$APP/Contents/Frameworks/Sparkle.framework" \
              "$APP/Contents/Library/Spotlight/DownrightSpotlight.mdimporter" \
              "$APP/Contents/Library/Spotlight/DownrightSpotlight.mdimporter/Contents/MacOS/DownrightSpotlight" \
              "$APP"/Contents/Frameworks/Sparkle.framework/Versions/*/XPCServices/*.xpc \
              "$APP"/Contents/Frameworks/Sparkle.framework/Versions/*/Autoupdate \
              "$APP"/Contents/Frameworks/Sparkle.framework/Versions/*/Updater.app \
              "$APP"/Contents/PlugIns/*.appex; do
            [ -e "$item" ] || continue
            codesign --verify --strict --verbose=2 "$item"
          done

      - name: Notarize, staple, and verify
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ env.APP }}"
          # Submit a transport archive of the signed app. Apple creates the
          # ticket only after this succeeds; stapling before submission can
          # never work for a fresh build.
          NOTARY_ZIP="$RUNNER_TEMP/Downright-$TAG-notarization.zip"
          ditto -c -k --keepParent --sequesterRsrc "$APP" "$NOTARY_ZIP"
          echo "$APPLE_API_PRIVATE_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "$NOTARY_ZIP" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 20m
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple "$APP"
          rm -f "$NOTARY_ZIP"
          # Rebuild the user-facing archive from the stapled app so offline
          # Gatekeeper verification does not depend on reaching Apple's CDN.
          ditto -c -k --keepParent --sequesterRsrc "$APP" "Downright-$TAG.zip"
          # Final verification battery.
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"
          lipo -info "$APP/Contents/MacOS/Downright" | grep -q "x86_64" || { echo "missing x86_64 slice"; exit 1; }
          lipo -info "$APP/Contents/MacOS/Downright" | grep -q "arm64" || { echo "missing arm64 slice"; exit 1; }
          Scripts/verify-bundle.sh "$APP" --production
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_P8: ${{ secrets.APPLE_API_PRIVATE_KEY_P8 }}

      - name: Package and notarise the DMG
        # The DMG is a convenience for humans; Sparkle's update archive stays
        # the zip.  Build it from the already-stapled app, then notarise and
        # staple the image itself so users who run straight from it are covered.
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ env.APP }}"
          Scripts/make-dmg.sh "$APP"
          # make-dmg.sh names the image from the human-facing app version.
          # Rename it to the per-commit release asset name before notarising so
          # the versioned archive, stable alias, and checksum are identical.
          SOURCE_DMG="dist/Downright-$MARKETING_VERSION.dmg"
          VERSIONED_DMG="Downright-$TAG.dmg"
          test -f "$SOURCE_DMG"
          mv "$SOURCE_DMG" "$VERSIONED_DMG"
          echo "$APPLE_API_PRIVATE_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "$VERSIONED_DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 20m
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple "$VERSIONED_DMG"
          xcrun stapler validate "$VERSIONED_DMG"
          cp "$VERSIONED_DMG" Downright.dmg
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_P8: ${{ secrets.APPLE_API_PRIVATE_KEY_P8 }}

      - name: Remove ephemeral signing keychain
        # The keychain holds the imported Developer ID identity; drop it as
        # soon as nothing needs it, on every path through the job.
        if: always()
        shell: bash
        run: |
          if [ -n "${KEYCHAIN:-}" ] && security list-keychains | grep -q "$(basename "$KEYCHAIN")"; then
            security default-keychain -d || true
            security delete-keychain "$KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      # ------------------------------------------------------------ artifacts
      - name: Collect checksums, dSYMs, and release notes
        run: |
          set -euo pipefail
          APP="${{ env.APP }}"
          mkdir -p artifacts
          shasum -a 256 "Downright-$TAG.zip" > artifacts/Downright-$TAG.zip.sha256
          shasum -a 256 "Downright-$TAG.dmg" > artifacts/Downright-$TAG.dmg.sha256
          shasum -a 256 Downright.dmg > artifacts/Downright.dmg.sha256
          echo "SHA256: $(cat artifacts/Downright-$TAG.zip.sha256)"
          # A GitHub Release asset must be a file, not a directory. Preserve
          # the complete symbol bundle in one deterministic archive and fail
          # instead of silently publishing a crash build with no symbols.
          DSYMS=".build-release/Downright.xcarchive/dSYMs"
          test -d "$DSYMS"
          ditto -c -k --keepParent --sequesterRsrc \
            "$DSYMS" "artifacts/Downright-$TAG-dSYMs.zip"
          shasum -a 256 "artifacts/Downright-$TAG-dSYMs.zip" \
            > "artifacts/Downright-$TAG-dSYMs.zip.sha256"
          # Auto-assemble release notes from the commits since the previous
          # generated or manually tagged release.
          PREV_TAG="$(git tag --sort=-creatordate | grep -E '^(auto-[0-9a-f]{40}|v[0-9]+\.[0-9]+\.[0-9]+)$' | grep -v "^${RELEASE_TAG}$" | head -1 || true)"
          if [ -n "$PREV_TAG" ]; then
            COMMITS="$(git log --oneline --no-merges "${PREV_TAG}..HEAD")"
          else
            COMMITS="$(git log --oneline --no-merges -30 HEAD)"
          fi
          {
            echo "# Downright $MARKETING_VERSION (build $BUILD)"
            echo
            echo "## What's new"
            echo
            echo "$COMMITS" | sed 's/^/- /'
            echo
            echo "_Full history: https://github.com/${{ github.repository }}/releases_"
          } > artifacts/RELEASE-NOTES.md
          echo "APP_BASENAME=Downright-$TAG.zip" >> "$GITHUB_ENV"

      - name: Fetch Sparkle signing tools (pinned version)
        run: |
          set -euo pipefail
          SPARKLE_SHA256="015336b601493e05c237964954bff6191370003d94edefe663724c88840d73cc"
          curl -fsSL -o /tmp/sparkle.tar.xz \
            https://github.com/sparkle-project/Sparkle/releases/download/2.9.5/Sparkle-2.9.5.tar.xz
          echo "$SPARKLE_SHA256  /tmp/sparkle.tar.xz" | shasum -a 256 -c -
          # Sparkle's archive has ./bin at its root; isolate extraction so the
          # tool paths remain stable and cannot collide with runner temp files.
          mkdir -p /tmp/sparkle
          tar xf /tmp/sparkle.tar.xz -C /tmp/sparkle
          ls /tmp/sparkle/bin/

      - name: Download supported previous release zips (for deltas)
        run: |
          set -euo pipefail
          mkdir -p /tmp/appcast-input
          cp "Downright-$TAG.zip" /tmp/appcast-input/
          # Latest three previous *full archive* assets become delta sources.
          # Delta assets are named like "Downright<build>-<fromBuild>.delta"
          # (Sparkle's own convention) and never match the full-archive regex,
          # so they cannot be mistaken for update archives.
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=10" \
            | jq -r '.[] | select(.prerelease == false) | .assets[]? | select(.name | test("^Downright-[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9]+-[0-9a-f]+)?\\.zip$")) | .browser_download_url' \
            | head -3 | while read -r url; do
                curl -fsSL -L -O --output-dir /tmp/appcast-input "$url"
              done
          ls -la /tmp/appcast-input/
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # ----------------------------------------- appcast (private key, stdin only)
      # generate_appcast does the whole job natively: per-archive EdDSA
      # signatures (it reads SUPublicEDKey from the built app), Markdown release
      # notes embedded as signed CDATA, delta updates from the previous zips,
      # enclosure URLs pointing at this tag's GitHub Release assets, and the
      # signed feed required by SURequireSignedFeed. Nothing may rewrite the
      # generated appcast afterwards.
      - name: Generate signed appcast with deltas
        shell: bash
        run: |
          set -euo pipefail
          # Release notes sit next to the archive so they are embedded.
          cp artifacts/RELEASE-NOTES.md "/tmp/appcast-input/Downright-$TAG.md"
          # The private key is fed through standard input; it is never written
          # to disk and never echoed (masked secret).
          # Trailing slash on the URL prefix is REQUIRED: it is used as a base
          # URL (URL(string:relativeTo:)), and without it the last path
          # component (the tag) is treated as a filename and dropped.
          echo "$SPARKLE_ED25519_PRIVATE_KEY" \
            | /tmp/sparkle/bin/generate_appcast \
                --ed-key-file - \
                --embed-release-notes \
                --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/" \
                --full-release-notes-url "https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG" \
                --link "https://github.com/${{ github.repository }}" \
                --maximum-versions 1 \
                /tmp/appcast-input
          # Validation battery (Sparkle 2.9.5 ships no appcast_validate tool).
          # sign_update --verify needs the private seed (it derives the public
          # key); the public key alone is rejected.
          echo "Validating generated appcast XML"
          xmllint --noout /tmp/appcast-input/appcast.xml
          if grep -q 'sparkle-signatures' /tmp/appcast-input/appcast.xml; then
            echo "Appcast feed signature block present"
          else
            echo "::error::generated appcast has no Sparkle feed signature block"
            exit 1
          fi
          echo "Verifying generated appcast signature"
          echo "$SPARKLE_ED25519_PRIVATE_KEY" \
            | /tmp/sparkle/bin/sign_update --verify --ed-key-file - /tmp/appcast-input/appcast.xml
          echo "Sparkle appcast signature verified"
          mkdir -p artifacts/pages
          cp /tmp/appcast-input/appcast.xml artifacts/pages/appcast.xml
          cp artifacts/RELEASE-NOTES.md artifacts/pages/RELEASE-NOTES.md
          echo "Copied signed appcast and release notes"
          # Delta archives referenced by the appcast must ship as assets of
          # THIS release (the download-url-prefix points here).  Sparkle names
          # them "<AppName><build>-<fromBuild>.delta" (e.g. Downright42-41.delta).
          shopt -s nullglob
          for delta in /tmp/appcast-input/*.delta; do
            cp "$delta" artifacts/
            echo "Copied delta $(basename "$delta")"
          done
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}

      # --------------------------------------------------------------- publish
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.release_identity.outputs.release_tag }}
          name: Downright ${{ env.MARKETING_VERSION }} (build ${{ env.BUILD }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            Downright-${{ steps.release_identity.outputs.tag }}.zip
            Downright-${{ steps.release_identity.outputs.tag }}.dmg
            Downright.dmg
            artifacts/Downright-${{ steps.release_identity.outputs.tag }}.zip.sha256
            artifacts/Downright-${{ steps.release_identity.outputs.tag }}.dmg.sha256
            artifacts/Downright.dmg.sha256
            artifacts/Downright-${{ steps.release_identity.outputs.tag }}-dSYMs.zip
            artifacts/Downright-${{ steps.release_identity.outputs.tag }}-dSYMs.zip.sha256
            artifacts/*.delta
          body_path: artifacts/RELEASE-NOTES.md

      - name: Verify public asset URL
        run: |
          set -euo pipefail
          URL="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/Downright-$TAG.zip"
          HTTP=$(curl -sIL -o /dev/null -w '%{http_code}' "$URL")
          [ "$HTTP" = "200" ] || [ "$HTTP" = "302" ] || { echo "asset not reachable: $HTTP"; exit 1; }
          PUBLISHED_SHA="$(curl -fsSL "$URL" | shasum -a 256 | awk '{print $1}')"
          LOCAL_SHA="$(cat artifacts/Downright-$TAG.zip.sha256 | awk '{print $1}')"
          [ "$PUBLISHED_SHA" = "$LOCAL_SHA" ] || { echo "checksum mismatch after publish"; exit 1; }
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/Downright-$TAG.dmg"
          DMG_HTTP=$(curl -sIL -o /dev/null -w '%{http_code}' "$DMG_URL")
          [ "$DMG_HTTP" = "200" ] || [ "$DMG_HTTP" = "302" ] || { echo "dmg not reachable: $DMG_HTTP"; exit 1; }
          PUBLISHED_DMG_SHA="$(curl -fsSL "$DMG_URL" | shasum -a 256 | awk '{print $1}')"
          LOCAL_DMG_SHA="$(cat artifacts/Downright-$TAG.dmg.sha256 | awk '{print $1}')"
          [ "$PUBLISHED_DMG_SHA" = "$LOCAL_DMG_SHA" ] || { echo "dmg checksum mismatch after publish"; exit 1; }
          # Delta assets referenced by the appcast must also be reachable at
          # their published URLs (e.g. Downright42-41.delta).
          for delta in artifacts/*.delta; do
            [ -f "$delta" ] || continue
            BASE=$(basename "$delta")
            DELTA_URL="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/$BASE"
            DH=$(curl -sIL -o /dev/null -w '%{http_code}' "$DELTA_URL")
            [ "$DH" = "200" ] || [ "$DH" = "302" ] || { echo "delta not reachable: $DH $BASE"; exit 1; }
            DL=$(curl -fsSL "$DELTA_URL" | shasum -a 256 | awk '{print $1}')
            LL=$(shasum -a 256 "$delta" | awk '{print $1}')
            [ "$DL" = "$LL" ] || { echo "delta checksum mismatch: $BASE"; exit 1; }
          done
          STABLE_DMG_URL="https://github.com/${{ github.repository }}/releases/latest/download/Downright.dmg"
          STABLE_DMG_SHA="$(cat artifacts/Downright.dmg.sha256 | awk '{print $1}')"
          for attempt in $(seq 1 30); do
            STABLE_HTTP=$(curl -sIL -o /dev/null -w '%{http_code}' "$STABLE_DMG_URL" || true)
            if [ "$STABLE_HTTP" = "200" ] || [ "$STABLE_HTTP" = "302" ]; then
              break
            fi
            sleep 2
          done
          [ "$STABLE_HTTP" = "200" ] || [ "$STABLE_HTTP" = "302" ] || {
            echo "stable DMG not reachable: $STABLE_HTTP"
            exit 1
          }
          PUBLISHED_STABLE_SHA="$(curl -fsSL "$STABLE_DMG_URL" | shasum -a 256 | awk '{print $1}')"
          [ "$PUBLISHED_STABLE_SHA" = "$STABLE_DMG_SHA" ] || {
            echo "stable DMG checksum mismatch"
            exit 1
          }

      - name: Upload Pages artifact (appcast + release notes)
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: artifacts/pages
          name: github-pages

      # ------------------------------------------------ deployment (final step)
  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Deploy signed appcast to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  verify-public-update:
    needs: [release, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout verifier
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 1

      - name: Verify the public Sparkle channel
        env:
          VERIFY_PUBLIC_UPDATE_ATTEMPTS: "45"
          VERIFY_PUBLIC_UPDATE_DELAY_SECONDS: "2"
        run: |
          Scripts/verify-public-update.sh \
            "https://ezzy1630.github.io/Downright/appcast.xml" \
            "${{ needs.release.outputs.marketing_version }}" \
            "${{ needs.release.outputs.build }}" \
            "${{ needs.release.outputs.release_tag }}"
