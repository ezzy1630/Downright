name: Downright
options:
  bundleIdPrefix: com.ezzy
  deploymentTarget:
    macOS: 14.0
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
packages:
  Downright:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.5
targets:
  Downright:
    type: application
    platform: macOS
    sources:
      - path: Sources/DownrightApp
      - path: Resources/AppIcon.png
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Downright
        product: MarkdownCore
      - package: Downright
        product: MarkdownRender
      - package: Sparkle
        product: Sparkle
      - target: DownrightQL
        embed: true
      - target: DownrightThumb
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ezzy.downright
        PRODUCT_NAME: Downright
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Config/Downright-Info.plist
        SWIFT_VERSION: 5.0
        MACOSX_DEPLOYMENT_TARGET: 14.0
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/../Frameworks'
  DownrightQL:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/DownrightQL
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Downright
        product: MarkdownCore
      - package: Downright
        product: MarkdownRender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ezzy.downright.quicklook
        PRODUCT_NAME: DownrightQL
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: YES
        INFOPLIST_FILE: Config/DownrightQL-Info.plist
        SWIFT_VERSION: 5.0
        MACOSX_DEPLOYMENT_TARGET: 14.0
  DownrightThumb:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/DownrightThumb
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Downright
        product: MarkdownCore
      - package: Downright
        product: MarkdownRender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ezzy.downright.thumbnail
        PRODUCT_NAME: DownrightThumb
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: YES
        INFOPLIST_FILE: Config/DownrightThumb-Info.plist
        SWIFT_VERSION: 5.0
        MACOSX_DEPLOYMENT_TARGET: 14.0
schemes:
  Downright:
    build:
      targets:
        Downright: all
    run:
      config: Debug
    archive:
      config: Release
