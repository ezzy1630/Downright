name: Downright
options:
  bundleIdPrefix: com.ezzy
  deploymentTarget:
    macOS: 14.0
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
packages:
  # The root package brings its own dependencies with it, including the
  # vendored SwiftMath at Vendor/SwiftMath (a path dependency in Package.swift).
  # It is deliberately not listed here: no target links it directly, and a
  # second reference to the same local package only invites two copies of it in
  # the resolved graph.
  Downright:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.5
targets:
  Downright:
    type: application
    platform: macOS
    sources:
      - path: Sources/DownrightApp
      - path: Resources/AppIcon.png
        buildPhase: resources
      - path: Resources/Welcome.md
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Downright
        product: MarkdownCore
      - package: Downright
        product: MarkdownRender
      - package: Downright
        product: drdownright
      - package: Sparkle
        product: Sparkle
      - target: DownrightQL
        embed: true
      - target: DownrightThumb
        embed: true
    # SwiftPM resource bundles: Xcode copies them into a target that links the
    # package, but it is implicit and it does not reach app extensions at all —
    # which is how the Quick Look extension shipped without the math fonts and
    # trapped on the first formula.  Copy them explicitly instead, and fail the
    # build rather than the preview when one is missing.  Runs before signing,
    # so the copies are sealed with the rest of the bundle.
    postBuildScripts: &embedResourceBundles
      - name: Embed SwiftPM resource bundles
        # No inputs/outputs to analyse: the phase is a cheap idempotent copy.
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$DEST"
          LOCK="${DEST}/.downright-resource-embed-lock"
          until mkdir "$LOCK" 2>/dev/null; do sleep 0.1; done
          trap 'rmdir "$LOCK" 2>/dev/null || true' EXIT
          for bundle in Downright_MarkdownRender.bundle SwiftMath_SwiftMath.bundle; do
              SRC="${BUILT_PRODUCTS_DIR}/${bundle}"
              if [ ! -d "$SRC" ]; then
                  echo "error: ${bundle} is missing from ${BUILT_PRODUCTS_DIR}" >&2
                  exit 1
              fi
              rm -rf "${DEST:?}/${bundle}"
              cp -R "$SRC" "$DEST/"
          done
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ezzy.downright
        PRODUCT_NAME: Downright
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Config/Downright-Info.plist
        SWIFT_VERSION: 5.0
        MACOSX_DEPLOYMENT_TARGET: 14.0
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/../Frameworks'
  DownrightQL:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/DownrightQL
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Downright
        product: MarkdownCore
      - package: Downright
        product: MarkdownRender
    postBuildScripts: *embedResourceBundles
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ezzy.downright.quicklook
        PRODUCT_NAME: DownrightQL
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Config/QuickLook.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        INFOPLIST_FILE: Config/DownrightQL-Info.plist
        SWIFT_VERSION: 5.0
        MACOSX_DEPLOYMENT_TARGET: 14.0
  DownrightThumb:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/DownrightThumb
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Downright
        product: MarkdownCore
      - package: Downright
        product: MarkdownRender
    postBuildScripts: *embedResourceBundles
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ezzy.downright.thumbnail
        PRODUCT_NAME: DownrightThumb
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Config/QuickLook.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        INFOPLIST_FILE: Config/DownrightThumb-Info.plist
        SWIFT_VERSION: 5.0
        MACOSX_DEPLOYMENT_TARGET: 14.0
schemes:
  Downright:
    build:
      targets:
        Downright: all
    run:
      config: Debug
    archive:
      config: Release
